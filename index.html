<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex, nofollow">
<title>Casapark · Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#F5F5F7; --branco:#FFFFFF; --areia:#E5E5EA; --suave:#F2F2F7; --trilho:#EBEBF0;
  --grafite:#1D1D1F; --concreto:#6E6E73; --pedra:#AEAEB2; --madeira:#007AFF; --madeira-esc:#0062CC;
  --salvia:#248A3D; --ambar:#B25000; --tijolo:#D70015; --ardosia:#5856D6;
  --f-titulo:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif;
  --f-texto:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', sans-serif;
  --raio:18px; --raio-p:10px;
  --sombra:0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papel);color:var(--grafite);font:400 15px/1.47 var(--f-texto);letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:3px solid rgba(0,122,255,.4);outline-offset:2px}
.ico{width:20px;height:20px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.p{width:16px;height:16px}

/* estrutura */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.menu{position:sticky;top:0;height:100vh;padding:32px 16px 24px;display:flex;flex-direction:column;gap:32px;background:rgba(255,255,255,.72);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-right:1px solid var(--areia)}
.marca{padding:0 12px}
.marca b{display:block;font:700 17px/1 var(--f-titulo);letter-spacing:.18em}
.marca span{display:block;margin-top:8px}
.data-hoje{padding:0 12px}
.data-hoje strong{display:block;font:600 15px/1.4 var(--f-titulo);margin-top:4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;min-height:40px;padding:8px 12px;border:0;border-radius:var(--raio-p);background:none;color:var(--grafite);font-weight:500;font-size:14px;text-align:left;cursor:pointer;transition:background .15s,color .15s}
.nav button .ico{color:var(--madeira)}
.nav button:hover{background:var(--suave)}
.nav button[aria-current="page"]{background:var(--madeira);color:#fff}
.nav button[aria-current="page"] .ico{color:#fff}
.menu-rodape{margin-top:auto;padding:0 12px;font-size:13px;color:var(--concreto)}
main{padding:40px 40px 48px;min-width:0;max-width:1520px}
.topo{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:32px}
h1{font:700 34px/1.15 var(--f-titulo);margin:0;letter-spacing:-.025em}
.sub{color:var(--concreto);margin:8px 0 0;max-width:75ch;font-size:16px}
.acoes{display:flex;gap:8px;flex-wrap:wrap}
.aviso-local{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;background:var(--branco);border-radius:14px;box-shadow:var(--sombra);border-left:4px solid #FF9500;padding:12px 16px;margin-bottom:24px}
.aviso-local[hidden]{display:none}

/* componentes */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 18px;border:0;border-radius:999px;background:var(--trilho);color:var(--madeira);font-weight:500;font-size:14px;line-height:1;cursor:pointer;transition:background .15s,transform .1s;text-decoration:none;white-space:nowrap}
.btn:hover{background:#E1E1E8}
.btn:active{transform:scale(.98)}
.btn.primario{background:var(--madeira);color:#fff}
.btn.primario:hover{background:var(--madeira-esc)}
.btn.texto{background:none;color:var(--madeira);padding:8px}
.btn.texto:hover{text-decoration:underline;text-underline-offset:3px}
.btn[aria-pressed="true"]{background:var(--madeira);color:#fff}
.segmentado{display:inline-flex;border-radius:10px;background:var(--trilho);padding:2px;gap:2px}
.segmentado button{min-height:34px;padding:6px 14px;border:0;border-radius:8px;background:none;color:var(--grafite);font-weight:500;font-size:13px;cursor:pointer;transition:background .15s,box-shadow .15s}
.segmentado button[aria-pressed="true"]{background:var(--branco);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
select,input[type=search],input[type=text],input[type=date],input[type=number]{min-height:40px;padding:8px 14px;border:1px solid var(--areia);border-radius:var(--raio-p);background:var(--branco);transition:border-color .15s,box-shadow .15s}
select:focus,input:focus{outline:none;border-color:var(--madeira);box-shadow:0 0 0 3px rgba(0,122,255,.18)}
input[type=search]{background:var(--trilho);border-color:transparent}
.grade{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}.c3{grid-column:span 3}
.cartao{background:var(--branco);border-radius:var(--raio);padding:28px;min-width:0;box-shadow:var(--sombra)}
.cartao h2,.h2{font:600 20px/1.3 var(--f-titulo);margin:0;letter-spacing:-.02em}
.cartao h3{font:600 16px/1.35 var(--f-titulo);margin:0;letter-spacing:-.01em}
.cab{display:flex;align-items:baseline;justify-content:space-between;gap:8px 16px;margin-bottom:20px;flex-wrap:wrap}
.rotulo{font-weight:500;font-size:12px;line-height:1.4;letter-spacing:0;color:var(--concreto)}
.sec{color:var(--concreto)}
.peq{font-size:13px}
.num{font:600 40px/1 var(--f-titulo);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.tab{font-variant-numeric:tabular-nums}
.alerta{display:flex;gap:10px;align-items:flex-start;margin:20px 0 0;padding:12px 16px;background:var(--suave);border-radius:12px;font-size:14px}
.alerta span{max-width:80ch}
.alerta .ico{color:var(--madeira);margin-top:2px}
.filtros{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:24px}
.vazio{color:var(--concreto);padding:16px 0}
.pilha>*+*{margin-top:20px}
.linha{display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap}
.entre{justify-content:space-between}
hr.fina{border:0;border-top:1px solid var(--areia);margin:16px 0}

table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-weight:500;font-size:12px;color:var(--concreto);text-align:left;padding:8px 12px;border-bottom:1px solid var(--areia);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--suave);vertical-align:top}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--suave)}
tr.clicavel{cursor:pointer}
.rolar{overflow-x:auto}

.pill{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:11px;line-height:1.2;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,currentColor 12%,transparent);white-space:nowrap}
.pill::before{display:none}
.ok{color:var(--salvia)}.atencao{color:var(--ambar)}.atraso{color:var(--tijolo)}.confirmar{color:var(--ardosia)}.neutro{color:var(--concreto)}
.cancelado{color:var(--concreto);text-decoration:line-through}
.tipo{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--concreto);white-space:nowrap}
.tipo i{width:8px;height:8px;border-radius:50%;display:inline-block}
.progresso{display:flex;align-items:center;gap:8px}
.barra{flex:1;height:6px;background:var(--trilho);border-radius:3px;overflow:hidden;min-width:48px}
.barra i{display:block;height:100%;background:var(--madeira);border-radius:3px}
.barra.alerta-b i{background:#FF9500}
.num.atraso{color:var(--tijolo)}.num.confirmar{color:var(--ardosia)}

.alvo{min-width:40px;min-height:40px;display:inline-grid;place-items:center;cursor:pointer;flex:none}
.marcar{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:1.5px solid #C7C7CC;border-radius:50%;background:#fff;cursor:pointer;display:grid;place-content:center;margin:0;transition:background .15s,border-color .15s}
.marcar:checked{background:var(--madeira);border-color:var(--madeira)}
.marcar:checked::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}

/* onde agir agora */
.agir{counter-reset:acao;list-style:none;margin:0;padding:0}
.agir li{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 0;border-top:1px solid var(--suave)}
.agir li:first-child{border-top:0;padding-top:0}
.agir li::before{counter-increment:acao;content:counter(acao);display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:rgba(0,122,255,.1);font:600 15px/1 var(--f-titulo);color:var(--madeira);font-variant-numeric:tabular-nums}
.agir p{margin:0;max-width:75ch;font-size:16px}
.indicadores{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:24px}
.indicadores>div{background:var(--suave);border-radius:14px;padding:16px 20px}
.indicadores .num{margin:8px 0 4px}

/* lista de tarefas */
.lista-t{list-style:none;margin:0;padding:0}
.lista-t li{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:8px 8px 8px 0;border-bottom:1px solid var(--suave);border-radius:10px;transition:background .15s}
.lista-t li:hover{background:var(--suave)}
.lista-t .t-nome{font-weight:500}
.lista-t .t-meta{font-size:13px;color:var(--concreto)}
.lista-t .t-dir{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
.grupo-t{margin-top:20px}
.grupo-t:first-child{margin-top:0}
.grupo-t>.linha .rotulo{font-weight:600;color:var(--grafite);font-size:13px}
.link-item{background:none;border:0;padding:0;color:var(--madeira);text-align:left;cursor:pointer}
.link-item:hover{text-decoration:underline;text-underline-offset:3px}
.link-item.h2,h3 .link-item,.t-nome.link-item{color:var(--grafite)}
.link-item.h2:hover,h3 .link-item:hover,.t-nome.link-item:hover{color:var(--madeira)}

/* faixa de 14 dias */
.faixa{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px}
.faixa .d{padding:8px 6px;min-height:136px;min-width:0;border-radius:12px;background:var(--branco)}
.faixa .d.fds{background:var(--suave)}
.faixa .d.hoje-d{box-shadow:inset 0 0 0 2px var(--madeira)}
.faixa .d.hoje-d .dn{color:var(--madeira)}
.faixa .dn{font:600 15px/1.2 var(--f-titulo);font-variant-numeric:tabular-nums}
.chip{display:block;width:100%;margin-top:4px;padding:3px 8px;border:0;border-left:3px solid;border-radius:6px;font-size:12px;line-height:1.35;text-align:left;cursor:pointer;color:var(--grafite);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:filter .15s}
.chip:hover{filter:brightness(.96)}
.chip.ext{border-left-style:dashed}
.faixa .chip{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.chip.pauta{white-space:normal}
.chip.pauta .nome{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chip.pend{box-shadow:inset 0 0 0 1px rgba(88,86,214,.35)}

/* calendário anual */
.ano{overflow-x:auto}
.ano-cab,.ano-mes{display:grid;grid-template-columns:96px repeat(31,minmax(24px,1fr));column-gap:0;min-width:900px}
.ano-cab{position:sticky;top:0;background:var(--branco);z-index:2;border-bottom:1px solid var(--areia)}
.ano-cab span{font-size:11px;color:var(--concreto);text-align:center;padding:4px 0;font-variant-numeric:tabular-nums}
.ano-mes{grid-auto-rows:22px;row-gap:2px;padding:6px 0;border-bottom:1px solid var(--suave);position:relative}
.ano-mes .m-nome{grid-column:1;grid-row:1/-1;font:600 14px/22px var(--f-titulo);padding-right:8px;text-transform:capitalize}
.ano-mes .fundo{grid-row:1/-1;z-index:0}
.fundo.fds{background:var(--suave)}
.fundo.feriado{background:repeating-linear-gradient(135deg,transparent 0 4px,var(--areia) 4px 5px)}
.fundo.fora{background:var(--papel)}
.fundo.hoje-col{box-shadow:inset 1px 0 0 var(--madeira),inset -1px 0 0 var(--madeira)}
.barra-item{position:relative;z-index:1;min-width:0;border:0;border-left:3px solid;border-radius:0 6px 6px 0;padding:0 6px;font-size:12px;line-height:22px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:var(--grafite);background:none;isolation:isolate}
.barra-item::before{content:"";position:absolute;inset:0 auto 0 0;width:calc(var(--f,1) * 100%);background:var(--bg);border-radius:0 6px 6px 0;z-index:-1}
.barra-item:hover{text-decoration:underline;text-underline-offset:3px}
.barra-item.ext{border-left-style:dashed}
.barra-item.continua{border-left-color:transparent!important}
.legenda{display:flex;flex-wrap:wrap;gap:8px}
.legenda button{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:6px 12px;border:0;border-radius:999px;background:var(--trilho);font-size:13px;font-weight:500;cursor:pointer;transition:background .15s,opacity .15s}
.legenda button i{width:8px;height:8px;border-radius:50%}
.legenda button[aria-pressed="false"]{color:var(--pedra);background:var(--suave)}
.legenda button[aria-pressed="false"] i{opacity:.3}
.legenda .fer{width:14px;height:14px;border-radius:4px!important;border:1px solid var(--areia);background:repeating-linear-gradient(135deg,transparent 0 3px,var(--areia) 3px 4px)}

/* calendário mensal */
.mes-grade{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--areia);border-left:1px solid var(--areia);border-radius:12px;overflow:hidden}
.mes-grade .ds{padding:8px;border-right:1px solid var(--areia);border-bottom:1px solid var(--areia);background:var(--suave);text-transform:capitalize}
.mes-grade .cel{min-height:128px;padding:8px;border-right:1px solid var(--areia);border-bottom:1px solid var(--areia);min-width:0}
.mes-grade .cel.fds{background:#FAFAFC}
.mes-grade .cel.outro{background:var(--papel);color:var(--pedra)}
.mes-grade .cel.feriado{background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(229,229,234,.7) 6px 7px)}
.mes-grade .cel.hoje-d .dn{color:#fff;background:var(--madeira);border-radius:999px;padding:0 8px}
.mes-grade .dn{font:600 14px/22px var(--f-titulo);font-variant-numeric:tabular-nums;display:inline-block}
.mes-grade .fer-nome{font-size:12px;color:var(--concreto);display:block}
.no-ar{display:flex;flex-direction:column;gap:4px;margin-bottom:16px}

/* gráfico de carga */
.grafico{position:relative}
.grafico svg{display:block;width:100%;height:auto;overflow:visible}
.dica{position:absolute;pointer-events:none;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:12px;padding:10px 14px;font-size:13px;max-width:320px;box-shadow:0 4px 24px rgba(0,0,0,.12);opacity:0;transition:opacity .12s;z-index:5}
.dica.ver{opacity:1}

/* eventos */
.lista-ev{list-style:none;margin:0;padding:0;max-height:760px;overflow:auto}
.lista-ev button{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;min-height:56px;padding:12px;border:0;border-radius:12px;background:none;text-align:left;cursor:pointer;transition:background .15s}
.lista-ev button:hover{background:var(--suave)}
.lista-ev button[aria-current="true"]{background:rgba(0,122,255,.08)}
.data-bloco{font:600 15px/1.1 var(--f-titulo);font-variant-numeric:tabular-nums}
.data-bloco small{display:block;font:500 11px/1.3 var(--f-texto);color:var(--concreto)}
.fatos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin:20px 0 0}
.fatos>div{background:var(--suave);border-radius:12px;padding:12px 14px}
.fatos dt{font-weight:500;font-size:12px;color:var(--concreto)}
.fatos dd{margin:4px 0 0}
.fatos select{width:100%}
.fase{margin-top:24px}
.fase-cab{display:grid;grid-template-columns:minmax(0,1fr) 160px 48px;gap:16px;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--areia)}
.fase-cab h3{font:600 16px/1.3 var(--f-titulo);margin:0}
.chk{list-style:none;margin:0;padding:0}
.chk li{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:4px 0;border-bottom:1px solid var(--suave)}
.chk li.feita .t-nome{color:var(--concreto);text-decoration:line-through;text-decoration-color:var(--pedra)}

/* campanhas */
.etapas{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:16px 0 8px}
.etapas span{height:6px;border-radius:3px;background:var(--trilho)}
.etapas span.feita{background:#34C759}
.etapas span.atual{background:var(--madeira)}
.etapas span.atrasada{background:#FF3B30}
.etapas-nomes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;font-size:11px;color:var(--concreto);line-height:1.25}
.empilhada{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;margin:8px 0}
.empilhada i{display:block;height:100%}
.contagens{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px}
.contagens b{font:600 15px var(--f-titulo);font-variant-numeric:tabular-nums}

/* redes */
.equilibrio li{display:grid;grid-template-columns:48px minmax(0,1fr) 112px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--suave)}
.equilibrio li>span:first-child{text-transform:capitalize;font-weight:500}
.equilibrio{list-style:none;margin:0;padding:0}

/* prime */
.linha-tempo{position:relative;height:160px;border-top:1px solid var(--areia);margin-top:8px}
.lt-mes{position:absolute;top:0;bottom:0;border-left:1px solid var(--suave);font-size:11px;color:var(--concreto);padding:4px;text-transform:capitalize}
.lt-faixa{position:absolute;height:24px;border-left:3px solid #AF52DE;background:rgba(175,82,222,.10);font-size:12px;line-height:24px;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:0 6px 6px 0}
.lt-marco{position:absolute;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--madeira);border:2px solid #fff;box-shadow:0 0 0 1px var(--madeira);padding:0;cursor:pointer}
.lt-marco::after{content:"";position:absolute;inset:-10px}
.lt-viagem{position:absolute;height:24px;border:0;border-left:3px solid #FF9500;background:rgba(255,149,0,.12);font-size:12px;line-height:24px;padding:0 8px;white-space:nowrap;cursor:pointer;border-radius:0 6px 6px 0;color:var(--grafite)}

dialog{border:0;border-radius:22px;padding:0;width:min(920px,calc(100% - 32px));max-height:calc(100vh - 64px);color:var(--grafite);background:var(--branco);box-shadow:0 24px 80px rgba(0,0,0,.2)}
dialog::backdrop{background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
dialog[open]{animation:surge .22s cubic-bezier(.2,.8,.2,1)}
.dlg-corpo{padding:36px}
.fechar{position:absolute;top:16px;right:16px;width:32px;height:32px;min-height:0;padding:0!important;border-radius:50%!important;background:var(--trilho)!important;color:var(--concreto)!important}
.fechar .ico{width:16px;height:16px}
form.campos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
form.campos label{display:flex;flex-direction:column;gap:8px}
form.campos .larga{grid-column:span 2}

.vista{animation:entra .2s ease-out}
@keyframes entra{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes surge{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:1100px){
  .c8,.c7,.c6,.c5,.c4{grid-column:span 12}
  .c3{grid-column:span 6}
}

.tl-barra{position:absolute;top:8px;height:24px;border:0;border-radius:8px;padding:0;background:color-mix(in srgb,var(--c) 20%,transparent);box-shadow:inset 3px 0 0 var(--c);cursor:pointer;overflow:visible;text-align:left;color:var(--grafite);transition:box-shadow .15s,filter .15s;animation:estica .6s cubic-bezier(.2,.8,.2,1) both;transform-origin:left}
.tl-barra:hover{box-shadow:inset 3px 0 0 var(--c),0 8px 18px -8px var(--c);filter:saturate(1.2)}
.tl-barra i{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--c) 42%,transparent);border-radius:8px 0 0 8px}
.tl-barra span{position:relative;display:block;padding:0 10px;font-size:12px;font-weight:600;line-height:24px;white-space:nowrap}
.tl-barra.pend{background-image:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--c) 14%,transparent) 6px 9px)}
.tl-marco{position:absolute;top:13px;width:14px;height:14px;border:0;padding:0;background:var(--c);transform:rotate(45deg);border-radius:3px;cursor:pointer;box-shadow:0 0 0 3px var(--branco)}
.tl-rot{position:absolute;top:11px;font-size:12px;white-space:nowrap;color:var(--concreto);pointer-events:none}
.tl-periodo{min-width:180px;text-align:center;text-transform:capitalize}
@keyframes estica{from{transform:scaleX(0);opacity:0}}

/* busca rápida */
.cmdk{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px;animation:aparece .15s forwards;opacity:0}
.cmdk[hidden]{display:none}
.cmdk-caixa{width:min(660px,100%);background:var(--vidro-forte);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);border-radius:22px;box-shadow:0 30px 90px rgba(0,0,0,.3),0 0 0 .5px rgba(0,0,0,.1);overflow:hidden;animation:surge .2s cubic-bezier(.2,.8,.2,1)}
.cmdk-in{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--areia);color:var(--concreto)}
.cmdk-in input{flex:1;border:0!important;background:none!important;font-size:19px;min-height:32px;padding:0;box-shadow:none!important;color:var(--grafite)}
#cmdk-res{list-style:none;margin:0;padding:8px;max-height:min(440px,58vh);overflow:auto}
.cmdk-g{font-size:11px;font-weight:600;color:var(--concreto);padding:12px 12px 4px;text-transform:uppercase;letter-spacing:.07em}
.cmdk-op{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer;color:var(--grafite)}
.cmdk-op .ico{color:var(--madeira)}
.cmdk-op span{flex:1;min-width:0}
.cmdk-op b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmdk-op small{display:block;font-size:12px;color:var(--concreto);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmdk-op[aria-selected="true"]{background:var(--madeira);color:#fff}
.cmdk-op[aria-selected="true"] small,.cmdk-op[aria-selected="true"] .ico{color:rgba(255,255,255,.85)}
.cmdk-op[aria-selected="true"] kbd{background:rgba(255,255,255,.2);color:#fff}
.cmdk-pt{width:10px;height:10px;border-radius:3px;flex:none;margin:0 3px}
.cmdk-vazio{padding:28px;text-align:center;color:var(--concreto)}
.cmdk-pe{display:flex;gap:16px;padding:10px 20px;border-top:1px solid var(--areia);font-size:12px;color:var(--concreto)}

/* avisos rápidos */
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:999px;background:#1D1D1F;color:#fff;font-size:14px;box-shadow:0 12px 32px rgba(0,0,0,.28);animation:surge .25s cubic-bezier(.2,.8,.2,1);max-width:min(520px,calc(100vw - 32px))}
.toast .ico{color:#30D158}
.toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.sai{opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s}
:root[data-theme="dark"] .toast{background:#F5F5F7;color:#1D1D1F}

.logo-cp{display:inline-block;height:20px;aspect-ratio:600/130;background:currentColor;-webkit-mask:var(--logo-cp) no-repeat left center/contain;mask:var(--logo-cp) no-repeat left center/contain;vertical-align:middle;flex:none}
.marca.ws{flex-direction:column;align-items:flex-start;gap:6px;padding:4px 12px 0}
.marca.ws .logo-cp{height:24px;color:var(--grafite)}
.marca.ws .rotulo{margin:0}
.hero-eyebrow{display:inline-flex;align-items:center;gap:10px}
.hero-eyebrow .logo-cp{height:18px;color:#fff}
.logo-movel{display:none}
@media (max-width:960px){.logo-movel{display:inline-block;height:20px;color:var(--grafite)}}
@media print{.logo-movel{display:inline-block!important;height:18px}}

/* BI de redes */
.bi-fontes{display:flex;flex-wrap:wrap;gap:6px}
.bi-fonte{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:5px 10px;border-radius:999px;background:var(--trilho);color:var(--concreto)}
.bi-fonte i{width:7px;height:7px;border-radius:50%;background:var(--pedra)}
.bi-fonte.on{background:color-mix(in srgb,#34C759 14%,transparent);color:var(--salvia)}
.bi-fonte.on i{background:#34C759;box-shadow:0 0 0 3px color-mix(in srgb,#34C759 25%,transparent);animation:pulsa 2s infinite}
@keyframes pulsa{50%{box-shadow:0 0 0 6px transparent}}
.bi-vazio{text-align:center;padding:56px 24px}
.bi-vazio>.ico{width:40px;height:40px;color:var(--madeira);margin-bottom:12px}
.bi-vazio h2{margin-bottom:8px}
.bi-vazio p{max-width:60ch;margin:0 auto 20px}
.bi-esq{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px}
.sk i{display:block;height:14px;border-radius:7px;margin:10px 0;background:linear-gradient(90deg,var(--suave),var(--trilho-h),var(--suave));background-size:200% 100%;animation:brilho 1.2s infinite linear}
.sk i:nth-child(2){height:36px;width:60%}.sk i:nth-child(3){width:40%}
.sk.alto i{height:240px}
@keyframes brilho{to{background-position:-200% 0}}
.bi-delta{font-weight:600;font-variant-numeric:tabular-nums}
.bi-delta.sobe{color:var(--salvia)}.bi-delta.desce{color:var(--tijolo)}
.bi-leg{font-size:14px;line-height:1.4;max-width:52ch;min-width:240px}
.bi-fmt{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);white-space:nowrap}
.bi-fmts li{display:grid;grid-template-columns:84px minmax(0,1fr) 60px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--suave)}
.bi-fmts .n{text-align:right;font-size:12px;color:var(--concreto)}
.bi-fmts b.n{font:600 16px/1.2 var(--f-titulo);color:var(--grafite);text-align:right}
.bi-dh{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr));gap:4px;align-items:center}
.bi-dh .rotulo{font-size:11px;text-align:center}
.bi-dh .rotulo:nth-child(8n+9),.bi-dh .rotulo:nth-child(9),.bi-dh>span:first-child{text-align:left}
.bi-dh i{display:grid;place-items:center;aspect-ratio:1.4;border-radius:8px;background:var(--suave);font-style:normal;font-size:11px;font-weight:600;color:var(--grafite)}
.bi-mini{display:flex;gap:16px;font-size:12px;color:var(--concreto)}
.bi-mini span{display:flex;flex-direction:column}
.bi-mini b{font:600 17px/1.2 var(--f-titulo)!important;color:var(--grafite);display:block}
.bi-mini b.ok{color:var(--salvia)}

@media (max-width:1100px){.camp-g{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:960px){
  .busca-lado,.nav-grupo,.marca.ws{display:none}
  .barra-topo{margin:0 0 20px}
  .busca-topo{min-width:0}
  .busca-topo span,.busca-topo kbd,.migalha{display:none}
  .hero{grid-template-columns:1fr;padding:28px 24px;align-items:start}
  .hero h2{font-size:34px}
  .hero-lado{align-items:flex-start;flex-direction:column-reverse}
  .hero-data b{font-size:56px}
  .camp-g{grid-template-columns:1fr}
  .kquadro{grid-template-columns:repeat(4,minmax(260px,82vw));scroll-snap-type:x mandatory}
  .kcol{scroll-snap-align:start}
  .tl{--tl-n:150px}
  #toasts{bottom:88px}
}
@media print{.barra-topo,.hero::before,.hero::after,#toasts,.cmdk{display:none!important}.hero{color:#1D1D1F;background:none;box-shadow:none;border:1px solid #ddd}}
</style>
<style id="portao-css">
/* portão de login */
body.bloqueado .app{display:none}
.portao{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:24px 16px;background:var(--papel);overflow:auto}
.portao::before{content:"";position:fixed;inset:-30% -10% auto auto;width:720px;height:720px;border-radius:50%;background:radial-gradient(circle,rgba(10,132,255,.18),transparent 65%);pointer-events:none}
.portao[hidden]{display:none}
.portao-caixa{position:relative;width:min(420px,100%);background:var(--branco);border-radius:24px;padding:36px 32px;box-shadow:var(--sombra-alta)}
.portao-logo{display:flex;flex-direction:column;gap:6px;margin-bottom:28px}
.portao-logo .logo-cp{height:26px;color:var(--grafite)}
.portao h1{font:700 26px/1.2 var(--f-titulo);letter-spacing:-.02em;margin:0 0 16px}
.portao-form{display:flex;flex-direction:column;gap:14px}
.portao-form label{display:flex;flex-direction:column;gap:6px}
.portao-form input{width:100%;min-height:46px;font-size:16px}
.portao-form .btn.primario{min-height:46px;font-size:15px;margin-top:4px}
.portao-form p{margin:0}
.portao-qr{display:block;width:200px;height:200px;margin:4px auto;background:#fff;border-radius:12px;padding:8px}
.portao-chave{display:block;word-break:break-all;font-size:13px;background:var(--suave);padding:10px 12px;border-radius:10px;margin-top:8px;user-select:all}
.portao-erro{color:var(--tijolo);font-size:14px;min-height:20px;margin:12px 0 0}
details summary{cursor:pointer}
/* conta */
.conta{position:relative}
.conta-btn{display:flex;align-items:center;gap:10px;min-height:38px;padding:4px 12px 4px 4px;border:0;border-radius:999px;background:var(--branco);box-shadow:var(--sombra);cursor:pointer;color:var(--grafite);text-align:left}
.conta-btn b{display:block;font-size:13px;font-weight:600;line-height:1.2}
.conta-btn small{display:block;font-size:11px;color:var(--concreto)}
.conta-menu{position:absolute;right:0;top:calc(100% + 8px);min-width:240px;background:var(--vidro-forte);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:14px;box-shadow:var(--sombra-alta);padding:6px;z-index:60}
.conta-menu button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;border-radius:10px;background:none;color:var(--grafite);cursor:pointer;font-size:14px}
.conta-menu button:hover{background:var(--suave)}
@media (max-width:960px){.conta-btn span{display:none}.conta-btn{padding:4px}}
/* leitores: controles de edição aparecem desativados (o banco também bloqueia) */
.papel-leitor .marcar[data-t],.papel-leitor .sel-resp,.papel-leitor #nova-demanda,.papel-leitor [data-kstatus],.papel-leitor .kcard{pointer-events:none}
.papel-leitor .marcar[data-t],.papel-leitor .sel-resp,.papel-leitor #nova-demanda{opacity:.45}
.papel-leitor .kcard{cursor:default;-webkit-user-drag:none}
tr.inativo td{opacity:.55}
.adm-versoes li{justify-content:space-between}
input[type=email],input[type=password]{min-height:40px;padding:8px 14px;border:1px solid var(--areia);border-radius:var(--raio-p);background:var(--branco);color:var(--grafite)}
form.campos input,form.campos select{width:100%;min-width:0}
td .btn.texto{display:block;margin-left:auto;padding:4px 0}
</style>
</head>
